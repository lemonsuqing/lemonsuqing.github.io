<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lemonsuqing&#39;s blog</title>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Fancybox 图片放大库 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/style.css">
<meta name="generator" content="Hexo 8.1.1"></head>
<body>

    <!-- 导航栏 -->
    <nav>
        <!-- 这里会自动读取你在 _config.yml 里设置的 title -->
        <a href="/" class="logo">🚀 lemonsuqing&#39;s blog</a>
        <div class="menu">
            <a href="/"><i class="fas fa-home"></i> 首页</a>
            
            <!-- 调整一下顺序，把分类和标签放在一起 -->
            <a href="/categories"><i class="fas fa-folder-open"></i> 分类</a> <!-- 新增 -->
            <a href="/tags"><i class="fas fa-tags"></i> 标签</a>
            
            <a href="/archives"><i class="fas fa-archive"></i> 归档</a>
            <a href="javascript:;" onclick="toggleSearch()"><i class="fas fa-search"></i> 搜索</a>
            
            <!-- 后台入口 (仅本地可见) -->
            <a href="/admin" target="_blank" class="admin-btn" style="display:none;"><i class="fas fa-user-cog"></i> 写博客</a>
            <script>
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    document.querySelector('.admin-btn').style.display = 'inline-flex';
                }
            </script>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="container">
        <!-- 归档/分类/标签 列表页 -->
<section>
    <!-- 头部标题区 -->
    <div style="text-align:center; padding: 40px 0; margin-bottom: 20px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">
            
                <i class="fas fa-history" style="color:var(--accent)"></i> 文章归档
            
        </h1>
        <p style="color:var(--text-sub)">
            共找到 1 篇相关文章
        </p>
    </div>

    <!-- 文章卡片网格 (完全复用首页样式) -->
    <div class="post-grid">
        
            <a href="/2026/01/09/hello-world/" class="card">
                <div class="card-title">Hello World</div>
                <div class="card-meta">
                    <!-- 日期 -->
                    <span><i class="far fa-calendar"></i> 2026-01-09</span>
                    
                    <!-- 分类 (如果有) -->
                    
                        <span style="margin-left:10px;"><i class="far fa-folder"></i> 测试</span>
                    
                </div>
                
                <!-- 摘要 -->
                <div class="card-excerpt">
                    
                    Welcome to Hexo! This is your very first post. Check documentation for more info...
                </div>

                <!-- 底部标签展示 (新增) -->
                
                    <div style="margin-top:15px; padding-top:10px; border-top:1px dashed var(--border);">
                        
                            <span style="font-size:0.8rem; color:var(--accent); margin-right:10px;">#test</span>
                        
                    </div>
                
            </a>
        
    </div>

    <!-- 分页 -->
    <div class="pagination">
        <span class="page-number current">1</span>
    </div>
</section>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 lemonsuqing</p>
        <p>Powered by Hexo & My Custom Theme</p>
    </footer>

    <!-- 搜索弹窗 (默认隐藏) -->
    <div id="search-modal" class="search-modal">
        <div class="search-box">
            <div class="search-header">
                <h3><i class="fas fa-search"></i> 站内搜索</h3>
                <button onclick="toggleSearch()"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="local-search-input" placeholder="请输入关键词...">
            <div id="local-search-result"></div>
        </div>
    </div>

    <!-- 脚本区域 -->
    <!-- 1. Fancybox 图片放大 -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 图片灯箱初始化
            const postImages = document.querySelectorAll('.post-body img');
            postImages.forEach(function(img) {
                const outer = img.outerHTML;
                const src = img.getAttribute('src');
                const alt = img.getAttribute('alt') || 'image';
                const newTag = document.createElement('a');
                newTag.href = src;
                newTag.setAttribute('data-fancybox', 'gallery');
                newTag.setAttribute('data-caption', alt);
                newTag.innerHTML = outer;
                img.parentNode.replaceChild(newTag, img);
            });
            Fancybox.bind("[data-fancybox]", {});
        });

        // 搜索弹窗开关
        function toggleSearch() {
            const modal = document.getElementById('search-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                document.getElementById('local-search-input').focus();
            }
        }
    </script>
    
    <!-- 2. 引入搜索逻辑 JS -->
    <script src="/js/search.js"></script>
</body>
</html>
